<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZK Report Puller — Cloud</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="logo">ZK</div>
      <div>
        <h1>Report Puller</h1>
        <p>Cloud · attendance reports from Supabase</p>
      </div>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <nav class="tabs" id="tabs">
    <button data-tab="reports" class="active">Reports</button>
    <button data-tab="employees">Employees</button>
    <button data-tab="devices">Devices</button>
  </nav>

  <main>
    <!-- REPORTS -->
    <section id="tab-reports" class="tab active">
      <div class="row-between"><h2>Reports</h2></div>
      <div class="card filters">
        <label>From<input type="date" id="r-from" /></label>
        <label>To<input type="date" id="r-to" /></label>
        <label>Device<select id="r-device"><option value="">All</option></select></label>
        <label>PIN<input id="r-pin" placeholder="all" /></label>
        <label>View
          <select id="r-kind">
            <option value="daily">Daily attendance</option>
            <option value="summary">Employee summary</option>
            <option value="punches">Raw punches</option>
          </select>
        </label>
        <div class="actions">
          <button id="runReport" class="btn primary">Run</button>
          <button id="expReport" class="btn">Export Excel</button>
        </div>
      </div>
      <div class="tablewrap"><table id="repTable"><thead></thead><tbody></tbody></table></div>
      <p class="hint" id="repMeta"></p>
    </section>

    <!-- EMPLOYEES -->
    <section id="tab-employees" class="tab">
      <div class="row-between"><h2>Employees (PIN → Name)</h2></div>
      <div class="card">
        <div class="actions">
          <input id="e-pin" placeholder="PIN" style="max-width:120px" />
          <input id="e-name" placeholder="Full name" />
          <button id="saveEmp" class="btn primary">Save</button>
        </div>
      </div>
      <div class="tablewrap"><table id="empTable"><thead><tr><th>PIN</th><th>Name</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>

    <!-- DEVICES -->
    <section id="tab-devices" class="tab">
      <div class="row-between"><h2>Devices</h2><button id="showAdd" class="btn">+ Add Device</button></div>
      <p class="hint">Devices the on-site agent pulls. Add one here and the agent picks it up on its next cycle.</p>
      <div id="addForm" class="card hidden">
        <div class="grid">
          <label>Name<input id="d-name" placeholder="K40 — Head Office" /></label>
          <label>IP Address<input id="d-ip" placeholder="192.168.0.201" /></label>
          <label>Port<input id="d-port" value="4370" /></label>
          <label>Serial (optional)<input id="d-serial" /></label>
        </div>
        <div class="actions">
          <button id="saveDevice" class="btn primary">Save</button>
          <button id="cancelAdd" class="btn ghost">Cancel</button>
          <span id="addErr" class="err"></span>
        </div>
      </div>
      <div class="tablewrap"><table id="devTable"><thead><tr><th>Name</th><th>Address</th><th>Serial</th><th>Punches</th><th></th></tr></thead><tbody></tbody></table></div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
