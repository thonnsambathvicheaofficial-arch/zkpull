<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sign in · Song Fa Water Tanks</title>
  <link rel="icon" href="logo.png" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    body{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;
      background:radial-gradient(130% 130% at 0% 0%,var(--brand-strong) 0%,#081d42 60%,#081d42 100%)}
    .login{width:100%;max-width:360px;background:var(--surface);border:1px solid var(--line);
      border-radius:20px;box-shadow:var(--shadow-lg);padding:30px 28px}
    .login .logo{width:64px;height:64px;border-radius:15px;font-size:17px;margin:0 auto 16px;background:#fff;box-shadow:var(--shadow-sm);padding:6px}
    .login .logo img{width:100%;height:100%;object-fit:contain}
    .login h1{font-size:19px;text-align:center;margin:0 0 4px;color:var(--ink);letter-spacing:-.01em}
    .login p{text-align:center;color:var(--muted);font-size:13px;margin:0 0 22px}
    .login label{margin-bottom:14px}
    .login .btn{width:100%;justify-content:center;padding:11px;margin-top:6px;font-size:14px}
    .login .err{display:block;text-align:center;margin-top:14px;min-height:16px}
  </style>
</head>
<body>
  <form class="login" id="form">
    <div class="logo"><img src="logo.png" alt="Song Fa Water Tanks" /></div>
    <h1>Song Fa Water Tanks</h1>
    <p>Sign in to view attendance</p>
    <label>Username<input id="u" autocomplete="username" autofocus /></label>
    <label>Password<input id="p" type="password" autocomplete="current-password" /></label>
    <button class="btn primary" type="submit" id="go">Sign in</button>
    <span class="err" id="err"></span>
  </form>
  <script>
    const form = document.getElementById('form')
    form.addEventListener('submit', async e => {
      e.preventDefault()
      const err = document.getElementById('err'); err.textContent = ''
      const go = document.getElementById('go'); go.disabled = true; go.textContent = 'Signing in…'
      try {
        const r = await fetch('/api/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ username: document.getElementById('u').value, password: document.getElementById('p').value }) })
        const d = await r.json()
        if (!r.ok) throw new Error(d.error || 'Sign in failed')
        location.href = '/'
      } catch (e) { err.textContent = e.message; go.disabled = false; go.textContent = 'Sign in' }
    })
  </script>
</body>
</html>
